<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-label="Heavy Equipment Pricing">
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:scaleY(.05)}}
.fade{animation:fade 1.2s both}@keyframes fade{from{opacity:0}}
.draw{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 2.4s ease-out .3s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.scan{animation:scan 3.5s ease-in-out infinite alternate}@keyframes scan{from{transform:translateX(0)}to{transform:translateX(150px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style>
