<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Terminal: python train.py --model varun-prajapati">
<style>
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
  .dim{fill:#7d8590}.txt{fill:#e6edf3}.g{fill:#3fb950}.b{fill:#58a6ff}.y{fill:#d29922}.p{fill:#bc8cff}
  .ln{opacity:0;animation:show .01s forwards}
  @keyframes show{to{opacity:1}}
  .type{animation:type 1.6s steps(52) .3s forwards;clip-path:inset(0 100% 0 0)}
  @keyframes type{to{clip-path:inset(0 0 0 0)}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .curve{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 5s ease-out 2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .dot{opacity:0;animation:show .01s 7s forwards}
  .pulse{animation:pulse 1.6s ease-in-out 7s infinite}
  @keyframes pulse{50%{r:9;opacity:.35}}
  @media (prefers-reduced-motion:reduce){.ln,.dot{opacity:1;animation:none}.type{clip-path:none;animation:none}.curve{stroke-dashoffset:0;animation:none}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b1a12"/></linearGradient>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb950" stop-opacity=".28"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="380" rx="14" fill="url(#bg)" stroke="#30363d"/>
<circle cx="24" cy="22" r="6" fill="#f85149"/><circle cx="44" cy="22" r="6" fill="#d29922"/><circle cx="64" cy="22" r="6" fill="#3fb950"/>
<text x="450" y="27" text-anchor="middle" class="m dim" font-size="12">varun@msu-baroda+iit-madras: ~/life — train.py</text>
<line x1="0" y1="42" x2="900" y2="42" stroke="#21262d"/>

<g class="m">
  <g class="type"><text x="24" y="76"><tspan class="g">❯</tspan> <tspan class="b">python</tspan> <tspan class="txt">train.py --model</tspan> <tspan class="y">varun-prajapati</tspan> <tspan class="txt">--epochs ∞</tspan></text></g>
  <text x="24" y="108" class="ln" style="animation-delay:2.1s"><tspan class="dim">[data] </tspan><tspan class="txt">CSE @ MSU Baroda  </tspan><tspan class="p">+</tspan><tspan class="txt">  BS Data Science @ IIT Madras</tspan></text>
  <text x="24" y="132" class="ln" style="animation-delay:2.6s"><tspan class="dim">[arch] </tspan><tspan class="txt">PyTorch → FastAPI → Node/Express → React + TS</tspan></text>
  <text x="24" y="156" class="ln" style="animation-delay:3.0s"><tspan class="dim">[gpu]  </tspan><tspan class="txt">curiosity:0  caffeine:1  </tspan><tspan class="dim">— both at 100% util</tspan></text>

  <text x="24" y="196" class="ln" style="animation-delay:3.6s"><tspan class="dim">epoch 01</tspan><tspan class="txt">  loss 0.912  </tspan><tspan class="g">██</tspan><tspan class="dim">░░░░░░░░  hello, world</tspan></text>
  <text x="24" y="220" class="ln" style="animation-delay:4.3s"><tspan class="dim">epoch 04</tspan><tspan class="txt">  loss 0.541  </tspan><tspan class="g">████</tspan><tspan class="dim">░░░░░░  full-stack apps + JWT</tspan></text>
  <text x="24" y="244" class="ln" style="animation-delay:5.0s"><tspan class="dim">epoch 09</tspan><tspan class="txt">  loss 0.193  </tspan><tspan class="g">███████</tspan><tspan class="dim">░░░  RMSLE 0.1928 · Dice 0.9796</tspan></text>
  <text x="24" y="268" class="ln" style="animation-delay:5.7s"><tspan class="dim">epoch 12</tspan><tspan class="txt">  loss 0.071  </tspan><tspan class="g">█████████</tspan><tspan class="dim">░  🥉 Adani Mindstorm 2026</tspan></text>

  <text x="24" y="308" class="ln" style="animation-delay:6.5s"><tspan class="g">✓ checkpoint saved</tspan><tspan class="dim"> → </tspan><tspan class="txt">github.com/vp916</tspan></text>
  <text x="24" y="340" class="ln" style="animation-delay:7s"><tspan class="g">❯</tspan><tspan class="txt"> still training</tspan><tspan class="g cur"> ▋</tspan></text>
</g>

<!-- loss curve panel -->
<g transform="translate(600,70)">
  <rect width="272" height="270" rx="10" fill="#0d1117" stroke="#21262d"/>
  <text x="16" y="26" class="m dim" font-size="11">train/loss</text>
  <text x="256" y="26" class="m g" font-size="11" text-anchor="end">● live</text>
  <g stroke="#21262d"><line x1="16" y1="80" x2="256" y2="80"/><line x1="16" y1="140" x2="256" y2="140"/><line x1="16" y1="200" x2="256" y2="200"/></g>
  <path d="M16 48 C50 60 60 150 100 168 S170 205 200 214 S240 222 256 224 L256 240 L16 240 Z" fill="url(#fill)" class="ln" style="animation-delay:6.5s"/>
  <path class="curve" d="M16 48 C50 60 60 150 100 168 S170 205 200 214 S240 222 256 224" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="dot pulse" cx="256" cy="224" r="5" fill="#3fb950"/>
  <text x="16" y="258" class="m dim" font-size="10">epoch 0</text>
  <text x="256" y="258" class="m dim" font-size="10" text-anchor="end">now</text>
</g>
</svg>
